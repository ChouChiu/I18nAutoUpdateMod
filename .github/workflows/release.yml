name: Release
on:
  release:
    types: [published]

jobs:
  build-release:
    name: Build Release
    permissions:
      contents: write
    uses: ./.github/workflows/common.yml
    with:
      type: Release
      is-snapshot: false
      change-log: ${{ github.event.release.body }}
      release-tag: ${{ github.event.release.tag_name }}
    secrets: inherit
