name: Sync Modrinth Metadata

on:
  workflow_dispatch:

jobs:
  sync-modrinth:
    name: Sync Modrinth Metadata
    runs-on: ubuntu-latest
    environment: Build
    steps:
      -
        name: Checkout
        uses: actions/checkout@v7
      -
        name: Sync summary and description
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          jq --null-input \
            --rawfile body README.md \
            --arg description "自动下载、更新、转换并应用 CFPA 简体中文资源包。 Automatically downloads, updates, converts, and applies CFPA's Simplified Chinese translation resource pack." \
            '{
              description: $description,
              body: $body,
              client_side: "required",
              server_side: "unsupported"
            }' > modrinth-project.json
          curl --fail-with-body \
            --request PATCH \
            --header "Authorization: $MODRINTH_TOKEN" \
            --header "Content-Type: application/json" \
            --data-binary @modrinth-project.json \
            https://api.modrinth.com/v2/project/mEn7eS3l
